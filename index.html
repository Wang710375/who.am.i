  <div id="app">
    <canvas id="scene"></canvas>

    <div id="hud" class="hidden">
      <div id="quest" class="quest">
        <div class="quest-top"><span class="quest-tag">目前任務</span><span class="quest-ch"></span></div>
        <div class="quest-title"></div>
        <div class="quest-detail"></div>
      </div>

      <div id="guide" class="guide hidden"><div class="g-arrow"></div><div class="g-name"></div></div>
    </div>

      <div id="hudRight" class="hud-right hidden">
      <div id="hudBtns" class="hud-btns">
        <button data-act="notebook" class="hbtn"><span class="hico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h11.5a1.5 1.5 0 0 1 1.5 1.5v15H6.5A1.5 1.5 0 0 1 5 18.5z"/><path d="M5 18.5A1.5 1.5 0 0 1 6.5 17H18"/><path d="M9 3.5v13.5"/><path d="M11.5 7h4M11.5 10h4"/></svg></span><span class="hlab">筆記</span><kbd>Tab</kbd></button>
        <button data-act="bag" class="hbtn"><span class="hico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.5c-3 2-4.5 5.5-4 9 .4 2.6 2.6 4 7.5 4s7.1-1.4 7.5-4c.5-3.5-1-7-4-9"/><path d="M8.5 7.5h7"/><path d="M9.5 7.5 8 4.5c1.4-.8 2.7-1 4-1s2.6.2 4 1l-1.5 3"/><path d="M8 7.5c1.2 1 6.8 1 8 0"/></svg></span><span class="hlab">背包</span><kbd>B</kbd></button>
        <button data-act="hint" class="hbtn"><span class="hico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v2"/><path d="M8.5 4.5h7"/><path d="M8 6.5c-2 1.4-3 3.4-3 5.5s1 4.1 3 5.5h8c2-1.4 3-3.4 3-5.5s-1-4.1-3-5.5z"/><path d="M12 6.5v11M9 7c-.8 1.4-1.2 3-1.2 5s.4 3.6 1.2 5M15 7c.8 1.4 1.2 3 1.2 5s-.4 3.6-1.2 5"/><path d="M9.5 17.5v2h5v-2M12 19.5v2"/></svg></span><span class="hlab">提示</span><kbd>H</kbd></button>
        <button data-act="fullscreen" class="hbtn" data-fs-icon><span class="hico"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="fs-in"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g><g class="fs-out"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></g></svg></span><span class="hlab">全螢幕</span><kbd>F</kbd></button>
        <button data-act="pause" class="hbtn"><span class="hico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10 8.5v7M14 8.5v7"/></svg></span><span class="hlab">暫停</span><kbd>Esc</kbd></button>
      </div>
      <div id="progress" class="progress" title="記憶進度"></div>
      </div>

    <div id="touch" class="touch hidden">
      <div id="joyZone" class="joy-zone"><div id="joyBase" class="joy-base"><div id="joyKnob" class="joy-knob"></div></div></div>
      <div id="lookZone" class="look-zone"></div>
      <button id="touchUse" class="touch-use hidden">調查</button>
    </div>

    <div id="dialog" class="dialog hidden">
      <div class="dlg-portrait"></div>
      <div class="dlg-name"></div>
      <div class="dlg-text"></div>
      <div class="dlg-next">點擊／空白鍵　繼續 ▾</div>
    </div>

    <div id="rotate" class="rotate hidden">

        <div class="rot-s">本遊戲需要橫向畫面才能遊玩</div>
        <button class="rot-fs" data-fs-icon data-rot-fs><span class="fs-lab">全螢幕</span></button>
      </div>
    </div>
    <div id="summary" class="summary hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="modal" class="modal hidden"><div class="modal-card"></div></div>

    <div id="intro" class="intro hidden"></div>
    <div id="fade" class="fade"></div>
    <div id="title" class="title-screen"></div>
    <div id="ending" class="ending hidden"></div>
  </div>

e:"我",npc:"鄰人",voice:"門外的聲音"},sg=["你醒了。","你發現自己躺在一間陌生的屋子裡。","你記不得自己的名字。","也想不起來自己為什麼會在這裡。"],rg=[{id:1,title:"陌生的名字——五柳之謎",location:"屋外・柳下",quote:"先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因以為號焉。",quoteMasked:"先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，□□□□□。",translation:"五柳先生不知道是什麼地方的人，也不清楚他的姓名和表字。住宅旁邊有五棵柳樹，於是就用「五柳」作為他的別號。",glossary:[{w:"何許",m:"何處、什麼地方"},{w:"詳",m:"清楚知道（不詳：不清楚）"},{w:"姓字",m:"姓名和表字"},{w:"宅",m:"住所、住宅",z:"宅：ㄓㄞˊ"},{w:"因以為號",m:"於是用（五柳）來作為別號"},{w:"焉",m:"句末語助詞，無義"}],clue:{id:"c1",name:"失落的姓名①——我的號",seal:"號",short:"「五柳先生」不是本名，而是因宅邊五棵柳樹而來的別號。",desc:"古人除了「名」與「字」，常另有「號」。這位先生連籍貫、姓名都不清楚，只因屋旁有五棵柳樹，就以「五柳」為號。古人常用柳、松、竹、菊、梅比喻隱逸或清高的人：柳枝看似柔弱，主幹卻堅韌——就像不與當權者正面衝突、卻堅守原則的隱者。"}},{id:2,title:"被遺忘的習慣——書案之謎",location:"茅屋・書案",quote:"閑靜少言，不慕榮利。好讀書，不求甚解；每有會意，便欣然忘食。",translation:"他安閒沉靜，很少說話，不羨慕榮華名利。喜歡讀書，只求領會要旨，不在字句上過分推敲；每當對書中的意旨有所領會，就高興得忘了吃飯。",glossary:[{w:"閑靜少言",m:"安閒沉靜，很少說話"},{w:"不慕榮利",m:"不羨慕榮華名利（慕：羨慕、嚮往）"},{w:"不求甚解",m:"只求領會要旨，不在字句上過分推敲"},{w:"會意",m:"領會書中的意旨"},{w:"欣然忘食",m:"高興得忘了吃飯"}],clue:{id:"c2",name:"失落的姓名②——我的個性",seal:"性",short:"安閒沉靜、少說話、不羨慕名利；讀書重在領會，一有心得就樂而忘食。",desc:"這個人不愛熱鬧、不追名逐利。讀書不是為了功名，而是享受「會意」的快樂——懂了，就高興得連飯都忘了吃。"}},{id:3,title:"喝不完的酒——酒甕之謎",location:"茅屋・牆角",quote:"性嗜酒，家貧不能常得。親舊知其如此，或置酒而招之；造飲輒盡，期在必醉；既醉而退，曾不吝情去留。",translation:"他天性愛喝酒，但家裡貧窮，不能經常喝到。親戚老友知道他這樣，有時就準備了酒來邀請他；他前去喝酒，總是把酒喝光，希望一定要喝醉；喝醉了就告退回家，從不在意是去是留。",glossary:[{w:"嗜",m:"愛好",z:"嗜：ㄕˋ"},{w:"親舊",m:"親戚和老朋友"},{w:"或",m:"有時"},{w:"造",m:"前往、到"},{w:"輒",m:"總是、就",z:"輒：ㄓㄜˊ"},{w:"期",m:"希望、期望"},{w:"既",m:"已經"},{w:"曾不",m:"竟不、從不"},{w:"吝情",m:"在意、捨不得",z:"吝：ㄌㄧㄣˋ"}],clue:{id:"c3",name:"失落的姓名③——我的嗜好",seal:"酒",short:"天性愛酒，卻因家貧不能常得；赴邀必盡興，醉了就走，率真不拘禮。",desc:"喝酒對他來說是率性的快樂：主人請，就去；去了就喝光；喝醉了就回家，不會客套地留下，也不會捨不得離開。重點在「真率自然」，而不是酗酒。"}},{id:4,title:"一貧如洗的家——生活之謎",location:"茅屋",quote:"環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空——晏如也。",translation:"簡陋的居室裡空空蕩蕩，擋不住風吹日曬；身上穿著打了補丁的粗布短衣，盛飯的簞、舀水的瓢經常是空的——他卻安然自在。",glossary:[{w:"環堵",m:"四周的土牆，形容居室狹小簡陋",z:"堵：ㄉㄨˇ"},{w:"蕭然",m:"空寂冷落的樣子"},{w:"不蔽風日",m:"遮擋不住風吹和日曬（蔽：遮蓋、擋住）",z:"蔽：ㄅㄧˋ"},{w:"短褐",m:"粗布短衣，貧苦人家的衣服",z:"褐：ㄏㄜˊ"},{w:"穿結",m:"衣服破了洞，又打結補綴"},{w:"簞",m:"盛飯的圓形竹器"},{w:"瓢",m:"舀水的器具，多用葫蘆剖成"},{w:"屢",m:"常常、經常",z:"屢：ㄌㄩˇ"},{w:"晏如",m:"安然自在的樣子",z:"晏：ㄧㄢˋ"}],clue:{id:"c4",name:"失落的姓名④——我的生活",seal:"居",short:"屋破、衣破、缺衣少食，卻「晏如也」——安然自得。",desc:"前面四句寫盡貧困，最後只用三個字「晏如也」翻轉：外在生活再清苦，內心依舊安然自在。這就是「安貧樂道」的人生態度。"}},{id:5,title:"最後一篇文章——作者之謎",location:"茅屋・文稿匣",quote:"常著文章自娛，頗示己志。忘懷得失，以此自終。",quote2:"贊曰：黔婁之妻有言：「不戚戚於貧賤，不汲汲於富貴。」",translation:"他常常寫文章自我娛樂，文章很能表現自己的志趣。他不把得失放在心上，就這樣度過一生。",translation2:"贊語說：黔婁的妻子曾說：「不為貧賤而憂愁，不急切地追求富貴。」",glossary:[{w:"著",m:"撰寫"},{w:"自娛",m:"自我娛樂"},{w:"頗",m:"甚、很、非常"},{w:"示己志",m:"表現自己的志趣"},{w:"忘懷得失",m:"不把得失放在心上"},{w:"以此自終",m:"就這樣度過一生"},{w:"戚戚",m:"憂愁的樣子"},{w:"貧賤",m:"貧苦而身分低微"},{w:"汲汲",m:"急切追求的樣子"},{w:"黔婁",m:"春秋時齊國的隱士，安貧守節",z:"黔：ㄑㄧㄢˊ"},{w:"酣觴賦詩",m:"盡情飲酒、作詩",z:"酣：ㄏㄢ　賦：ㄈㄨˋ"}],clue:null}],ag={neighbor:{name:"鄰人"},willow1:{name:"柳樹",lines:[{s:"narr",t:"柳枝細長低垂，風一吹，便像簾子一樣輕輕晃動。"},{s:"me",t:"站在這裡，好像聽過無數次這樣的風聲。"}]},willow2:{name:"柳樹",lines:[{s:"narr",t:"這棵柳樹靠近屋簷，樹皮被摸得光滑，像是常有人倚著它。"},{s:"me",t:"我……常靠在這裡發呆嗎？"}]},willow3:{name:"柳樹",lines:[{s:"narr",t:"樹下有一塊被坐得平平的石頭，石頭旁的泥地上，留著一圈酒壺壓出的印子。"},{s:"me",t:"坐在這裡喝酒、讀書……這種感覺，好熟悉。"}]},willow4:{name:"柳樹",lines:[{s:"narr",t:"柳條垂到肩頭，帶著淡淡的青草味。"},{s:"me",t:"每年春天，這幾棵樹都會先綠起來。"}]},willow5:{name:"柳樹",lines:[{s:"narr",t:"這棵柳樹最老，樹幹粗得一個人抱不住。"},{s:"me",t:"它在這裡，一定比我住得還久。"}]},willowAll:[{s:"me",t:"一、二、三、四、五……宅邊，正好有五棵柳樹。"},{s:"me",t:"五棵柳樹……五柳……"},{s:"me",t:"腦海中，好像有一段文字慢慢浮了上來。"}],gate:{name:"柴門",lines:[{s:"narr",t:"柴門外是一片田野，遠處的山在霧裡若隱若現。"},{s:"me",t:"在想起自己是誰之前……還是先別離開吧。"}]},well:{name:"水井",lines:[{s:"narr",t:"井水很清，映出一張陌生又熟悉的臉。"},{s:"me",t:"這張臉……是我嗎？"}]},chrys:{name:"籬下花叢",lines:[{s:"narr",t:"竹籬下種著幾株花，被照顧得很好，在風裡輕輕搖著。"}]},book:{name:"讀到一半的書",lines:[{s:"narr",t:"書攤開在矮矮的書案上，讀到一半。旁邊的一碗飯早就涼了，動也沒動。"},{s:"narr",t:"書頁空白處，有人用毛筆寫著：「好讀書，不求甚解；每有會意，便欣然忘食。」"},{s:"me",t:"讀書讀到……忘了吃飯？"}]},inkstone:{name:"硯臺與毛筆",lines:[{s:"narr",t:"硯臺裡的墨還沒乾，毛筆斜斜擱在一旁。"}]},scroll1:{name:"書卷（甲）",statement:"此人安閒沉靜，很少說話。",lines:[{s:"narr",t:"書卷上寫著：「此人安閒沉靜，很少說話。」"}]},scroll2:{name:"書卷（乙）",statement:"他高談闊論，喜歡在人群中滔滔不絕。",lines:[{s:"narr",t:"書卷上寫著：「他高談闊論，喜歡在人群中滔滔不絕。」"}]},scroll3:{name:"書卷（丙）",statement:"他不羨慕榮華與名利。",lines:[{s:"narr",t:"書卷上寫著：「他不羨慕榮華與名利。」"}]},scroll4:{name:"書卷（丁）",statement:"他日夜苦讀，只為求取功名、出仕做官。",lines:[{s:"narr",t:"書卷上寫著：「他日夜苦讀，只為求取功名、出仕做官。」"}]},scroll5:{name:"書卷（戊）",statement:"讀書重在領會要旨，一有心得就高興得忘了吃飯。",lines:[{s:"narr",t:"書卷上寫著：「讀書重在領會要旨，一有心得就高興得忘了吃飯。」"}]},scroll6:{name:"書卷（己）",statement:"他讀書一字一句反覆考據，非弄得極其透徹不可。",lines:[{s:"narr",t:"書卷上寫著：「他讀書一字一句反覆考據，非弄得極其透徹不可。」"}]},bookcase:{name:"上鎖的書箱",lines:[{s:"narr",t:"牆角放著一只舊書箱，箱上掛著一道木製密鎖，鎖面刻著：「知我者，方能開此箱。」"}],notReady:[{s:"me",t:"「知我者」……要先弄清楚這屋子的主人是什麼樣的人。看看書案上的書，還有散落在屋裡的書卷吧。"}]},notes:{name:"讀書札記",lines:[{s:"narr",t:"書箱裡放著一疊札記，紙頁已經泛黃。"},{s:"narr",t:"「今日讀書，忽有所會，喜而忘食。友人笑我癡，我亦笑。」"},{s:"me",t:"這筆跡……怎麼如此熟悉？"},{s:"narr",t:"札記的最後一頁寫著：「昨夜醉歸，酒甕已空。」"},{s:"me",t:"酒甕……？"}]},letter:{name:"窗臺上的信",lines:[{s:"narr",t:"一封摺好的信：「知先生性好飲，而家貧不能常得。今備薄酒數壺，請先生過舍一敘。——親舊某拜上」"},{s:"me",t:"原來，常有親友備酒請我。"}]},jars:{name:"牆角的空酒壺",lines:[{s:"narr",t:"幾只酒壺東倒西歪，搖一搖——空的，一滴不剩。"},{s:"me",t:"家裡的酒……總是不夠喝。"}]},lantern:{name:"門邊的舊燈籠",lines:[{s:"narr",t:"門邊掛著一盞舊燈籠，燈罩上還沾著夜露。"},{s:"me",t:"昨夜，好像就是提著它，一個人搖搖晃晃走回家的。"}]},wineCabinet:{name:"封泥酒甕",lines:[{s:"narr",t:"牆角有一口封著泥的酒甕，甕頸繞著六枚竹籤，甕身刻著：「依時序而置，封泥自開。」"}],notReady:[{s:"me",t:"「依時序」……得先想起昨天喝酒時發生了什麼事。屋裡的東西也許能幫我回想。"}]},cup:{name:"五柳陶杯",lines:[{s:"narr",t:"封泥裂開，甕裡空空如也，只有一只刻著五棵柳樹的陶杯擱在甕口。"},{s:"me",t:"這是……我的杯子。"}]},walls:{name:"四面土牆",pre:[{s:"narr",t:"四面土牆斑駁龜裂，什麼裝飾也沒有。"}]},hole:{name:"牆上的破洞",pre:[{s:"narr",t:"牆上有個破洞，屋頂的茅草也有一處透著天光，陽光和冷風一起鑽了進來。"}]},clothes:{name:"掛著的舊衣",pre:[{s:"narr",t:"木架上掛著一件舊衣服。"}]},danpiao:{name:"竹器與葫蘆瓢",pre:[{s:"narr",t:"架上放著一只圓竹器和一把葫蘆做的瓢。"}]},bed:{name:"草蓆",pre:[{s:"narr",t:"你醒來時躺著的草蓆，薄得幾乎感覺得到地面的涼。"}]},manuscript:{name:"書案上的文稿",lines:[{s:"narr",t:"那本書底下，壓著一疊寫到一半的文稿，墨跡猶新。"},{s:"narr",t:"「常著文章自娛，頗示己志。忘懷得失，以此自終。」"},{s:"me",t:"寫文章……是為了讓自己快樂，也寫出自己的志向。"}]},zanScroll:{name:"床頭的舊卷軸",pre:[{s:"narr",t:"床頭上方掛著一幅舊卷軸，被油燈的煙燻得發黑，字跡模糊難辨。"}],lines:[{s:"narr",t:"卷軸上的煙垢不知何時淡去了，紙面潔白，字跡清清楚楚。開頭寫著「贊曰」兩字。"},{s:"narr",t:"「黔婁之妻有言：『不戚戚於貧賤，不汲汲於富貴。』」"},{s:"me",t:"「贊」……是傳記最後，作者對人物的評論嗎？"}]},sealBox:{name:"床尾的木匣",lines:[{s:"narr",t:"床尾放著一只木匣，匣蓋上嵌著四枚圓形印記，彼此之間刻著柳葉紋。"}],locked:[{s:"me",t:"匣子打不開。四枚印記……也許要找回四段關於「我」的記憶，才能打開。"}],notReady:[{s:"me",t:"四枚印記都亮了，可是匣子還打不開。先讀懂書案上的文稿和床頭的卷軸吧。"}]},willowStone:{name:"柳下的石頭",pre:[{s:"narr",t:"一塊被坐得平平的石頭。"}],lines:[{s:"narr",t:"你在柳樹下的石頭上坐了下來。風吹過柳枝，沙沙作響。"},{s:"me",t:"閉上眼睛……那段殘缺的文字，好像越來越清楚了。"}],done:[{s:"narr",t:"一塊被坐得平平的石頭。坐在這裡，心裡就安靜下來。"}]}},og={wake:[{s:"voice",t:"五柳先生？您醒了嗎？"},{s:"me",t:"五柳先生……？"},{s:"me",t:"是在叫我嗎？"}],npc1:[{s:"npc",t:"五柳先生，您今日怎麼如此恍惚？"},{s:"me",t:"五柳先生？那是我的名字？"},{s:"npc",t:"您連自己的號都忘了？"},{s:"me",t:"「號」……那不是本名嗎？"},{s:"npc",t:"說來慚愧，我也不知道您是哪裡人、姓什麼叫什麼。您從不提自己的來歷。"},{s:"npc",t:"只因您屋旁有五棵柳樹，村裡人就都喊您「五柳先生」。您平常最愛在那幾棵柳樹下坐著，去看看吧，說不定能想起什麼。"}],npc1b:[{s:"npc",t:"屋旁那幾棵柳樹，您都看過了嗎？"}],ch1done:[{s:"me",t:"原來，五柳先生並不是我的本名……"},{s:"me",t:"只因為屋旁有五棵柳樹，大家才這樣稱呼我。"},{s:"me",t:"那麼——我究竟是誰？"},{s:"me",t:"一個人的名號可以隨便取，可是平日做些什麼、讀些什麼，總騙不了人。"},{s:"me",t:"回屋裡看看我讀的書吧。"}],npc2:[{s:"npc",t:"先生又讀書讀得忘記吃飯了？書案上的飯都涼了。"},{s:"me",t:"我……很喜歡讀書嗎？"},{s:"npc",t:"可不是！不過屋裡那些書卷，有些是愛說閒話的人寫了塞給您的，說的不見得是真正的您。"},{s:"npc",t:"您自己的事，還是您自己分辨吧。"}],npc2b:[{s:"npc",t:"那些書卷，真的假的都有，您可得看仔細。"}],ch2done:[{s:"me",t:"安閒、少話、不羨慕名利……讀書讀到忘了吃飯。"},{s:"me",t:"這些，都是我嗎？"},{s:"me",t:"「昨夜醉歸，酒甕已空」……是牆角那口酒甕嗎？"}],npc3:[{s:"npc",t:"先生，昨日您喝醉後就自行回家了，連告別都不在意！"},{s:"me",t:"我……喝醉了？"},{s:"npc",t:"您呀，一沾了酒就格外真性情。昨天的事，您還記得多少？"}],npc3b:[{s:"npc",t:"信、酒壺、燈籠……昨天的事都在這屋裡了。"}],ch3done:[{s:"me",t:"有人請，就去；去了就喝光；醉了就走，不扭捏、不客套。"},{s:"me",t:"我好像……是個很率真的人。"},{s:"me",t:"這間小小的茅屋，好像處處藏著那篇文字的影子。"}],npc4:[{s:"npc",t:"先生，您這茅屋呀……風一吹就漏，太陽一曬就透。"},{s:"me",t:"這間屋子，好像處處藏著那篇文字的影子。"},{s:"me",t:"讓我一句一句，在屋裡找出來。"}],npc4q:[{s:"npc",t:"先生，您的日子這般清苦，難道不覺得難過？"}],ch4done:[{s:"me",t:"明明生活如此清苦……"},{s:"me",t:"為何我心中，卻沒有失落？"},{s:"narr",t:"床尾的木匣上，四枚印記同時亮起朱紅色的光。"},{s:"narr",t:"書案上那本書底下，好像壓著什麼東西。"}],npc5:[{s:"npc",t:"床尾那只木匣……您從來不讓人碰。"},{s:"npc",t:"您說，那裡藏著您最想說的話。"}]},lg=[{phrase:"環堵蕭然",target:"walls",found:"四周土牆圍成的小屋，空空蕩蕩——「環堵蕭然」。環堵：四周的土牆；蕭然：空寂冷落。"},{phrase:"不蔽風日",target:"hole",found:"風從破洞灌進來，陽光也直直照入——「不蔽風日」：擋不住風吹日曬。"},{phrase:"短褐穿結",target:"clothes",found:"粗布短衣上滿是破洞與補丁——「短褐穿結」。褐：粗布衣；穿：破洞；結：打結補綴。"},{phrase:"簞瓢屢空",target:"danpiao",found:"盛飯的竹簞和舀水的瓢，都是空的——「簞瓢屢空」。屢：常常。"}],cg="這件東西，似乎和「{p}」對不上。再讀一次這四個字的意思，想想它在描寫什麼。",hg={ch1_words:{type:"connect",title:"記憶殘句：字詞連連看",source:"先生不知何許人也，亦不詳其姓字。",pairs:[{id:"a",word:"何許",meaning:"何處、什麼地方"},{id:"b",word:"詳",meaning:"清楚知道"},{id:"c",word:"姓字",meaning:"姓名和表字"}],distractors:["允許、許可","詳細描寫"],explain:"「不知何許人也」：不知道是什麼地方的人。「亦不詳其姓字」：也不清楚他的姓名和表字。連身分都說不清——難怪你也想不起自己是誰。"},ch1_stele:{type:"slots",title:"記憶殘句：補全文字",prompt:"腦海中浮現的句子缺了五個字。把浮現在心頭的字，依正確順序放進空格，補全這句話。",lead:"宅邊有五柳樹，",tail:"。",answer:["因","以","為","號","焉"],chips:["號","名","因","焉","為","字","以"],hint:"注意：鄰人說「五柳先生」是你的「號」，不是名，也不是字。句尾的「焉」常放在句子最後。",explain:"「因以為號焉」＝因（於是）＋以（用它）＋為號（作為別號）＋焉（句末語助詞）。古人有名、有字，也常有「號」——五柳，正是一個號。"},ch1_infer:{type:"choice",title:"推理：這個稱呼從哪裡來？",questions:[{q:"根據你回想起來的文字，「五柳先生」這個稱呼是怎麼來的？",options:["是父母取的本名","因為住宅旁有五棵柳樹，就用來作為別號","是朝廷賜給他的官銜","因為他靠種柳樹賣錢維生"],answer:1,explain:"「宅邊有五柳樹，因以為號焉」——以住處的特徵為號。這也表示他連真正的姓名都不在意，不刻意留名。"}]},ch2_classify:{type:"classify",title:"書卷真偽",prompt:"屋裡的書卷有真有假。把每張書卷拖進「符合原文」或「不符合原文」。",source:"閑靜少言，不慕榮利。好讀書，不求甚解；每有會意，便欣然忘食。",bins:[{id:"t",label:"符合原文"},{id:"f",label:"不符合原文"}],items:[{id:"scroll1",bin:"t"},{id:"scroll2",bin:"f"},{id:"scroll3",bin:"t"},{id:"scroll4",bin:"f"},{id:"scroll5",bin:"t"},{id:"scroll6",bin:"f"}],explain:"「閑靜少言」不是高談闊論；「不慕榮利」不是為求功名而讀書；「不求甚解」是只求領會要旨，不是字字考據。"},ch2_words:{type:"flip",title:"書箱密鎖：翻牌配對",prompt:"密鎖上有十張木片。翻開兩張：一張字詞、一張解釋，意思相符就配對成功。",source:"閑靜少言，不慕榮利。好讀書，不求甚解；每有會意，便欣然忘食。",pairs:[{id:"a",word:"閑靜少言",meaning:"安閒沉靜，很少說話"},{id:"b",word:"不慕榮利",meaning:"不羨慕榮華名利"},{id:"c",word:"不求甚解",meaning:"只求領會要旨，不在字句上過分推敲"},{id:"d",word:"會意",meaning:"領會書中的意旨"},{id:"e",word:"欣然忘食",meaning:"高興得忘了吃飯"}],distractors:["讀書必求徹底精通每個字","急切追求名聲利益"],explain:"注意「不求甚解」：今天常被誤用成「做事馬虎」，但在本文是讀書重在領會大意、不鑽牛角尖的意思。"},ch3_order:{type:"order",title:"飲酒事件排序",prompt:"昨天到底發生了什麼？把六個場景依照原文的順序排好。（拖曳卡片，或用箭頭移動）",source:"親舊知其如此，或置酒而招之；造飲輒盡，期在必醉；既醉而退，曾不吝情去留。",items:[{id:"1",text:"親友知道他愛喝酒，卻因家貧常喝不到",quote:"親舊知其如此"},{id:"2",text:"有時，親友準備了酒來邀請他",quote:"或置酒而招之"},{id:"3",text:"他前去赴宴，總是把酒喝光",quote:"造飲輒盡"},{id:"4",text:"他希望一定要喝醉",quote:"期在必醉"},{id:"5",text:"喝醉了，就告辭回家",quote:"既醉而退"},{id:"6",text:"走或留，他從不放在心上",quote:"曾不吝情去留"}],explain:"這一串動作寫得乾脆俐落：招之→造飲→輒盡→必醉→既醉而退。最後的「曾不吝情去留」點出他率真自然、不拘世俗禮節。"},ch3_words_a:{type:"pick",title:"酒甕機關（上）：圈出字詞",prompt:"六枚竹籤上刻著同一句話。依照題目，在原句中點出正確的字詞。",sentence:"性嗜酒，家貧不能常得。親舊知其如此，或置酒而招之；造飲輒盡",questions:[{target:"嗜",meaning:"愛好"},{target:"親舊",meaning:"親戚和老朋友"},{target:"或",meaning:"有時"},{target:"造",meaning:"前往、到"},{target:"輒",meaning:"總是、就"}],explain:"「或」在這裡不是「或者」，而是「有時」；「造」不是製造，而是「前往」。文言字常有和今天不同的意思。"},ch3_words_b:{type:"connect",title:"酒甕機關（下）：字詞連連看",source:"……期在必醉；既醉而退，曾不吝情去留。",pairs:[{id:"a",word:"期",meaning:"希望、期望"},{id:"b",word:"既",meaning:"已經"},{id:"c",word:"曾不",meaning:"竟不、從不"},{id:"d",word:"吝情",meaning:"在意、捨不得"}],distractors:["吝嗇、小氣","日期、期限"],explain:"「曾不吝情去留」：從不在意去留——醉了就走，不會因為捨不得而勉強留下，也不在乎主人怎麼想。"},ch4_yanru:{type:"choice",title:"人物推理：晏如也",questions:[{q:"鄰人問：「日子這般清苦，難道不覺得難過？」根據原文「……簞瓢屢空——晏如也」，五柳先生最可能怎麼回答？",options:["唉，苦不堪言，我天天都在發愁。","我心裡安然自在，並不以此為苦。","我正努力存錢，好早日搬進大宅子。","所以我打算去求官，換個好日子。"],answer:1,explain:"「晏如」是安然自在的樣子。前面寫盡貧困，最後三個字卻寫出他內心平靜，不被貧窮打倒。"},{q:"「晏如也」三個字，表現出五柳先生怎樣的人生態度？",options:["怨天尤人，覺得命運不公","安於貧困，自得其樂","表面清高，其實很在意別人的眼光","汲汲營營，想盡辦法改善生活"],answer:1,explain:"這就是「安貧樂道」：物質貧乏，精神卻富足。"}]},ch5_words:{type:"match",title:"謎題一：我的志趣",prompt:"把原文拖到正確的白話翻譯上。",source:"常著文章自娛，頗示己志。忘懷得失，以此自終。／不戚戚於貧賤，不汲汲於富貴。",pairs:[{id:"a",word:"常著文章自娛",meaning:"常常寫文章自我娛樂"},{id:"b",word:"頗示己志",meaning:"很能表現自己的志趣"},{id:"c",word:"忘懷得失",meaning:"不把得失放在心上"},{id:"d",word:"以此自終",meaning:"就這樣度過一生"},{id:"e",word:"不戚戚於貧賤",meaning:"不為貧賤而憂愁"},{id:"f",word:"不汲汲於富貴",meaning:"不急切地追求富貴"}],distractors:["寫文章是為了揚名天下","為了貧賤而悲傷不已"],explain:"寫文章不是為了名利，而是「自娛」、「示己志」——這篇文章本身，也許就是在「示己志」。"},ch5_infer:{type:"choice",title:"謎題二：我的人生態度",questions:[{q:"五柳先生重視榮華富貴嗎？哪些線索可以證明？",options:["重視，因為他常去參加親友的酒宴","不重視：「不慕榮利」、「不汲汲於富貴」","很重視，他讀書就是為了做官","無法判斷，文章沒有提到"],answer:1,explain:"第二章的「不慕榮利」與贊語的「不汲汲於富貴」前後呼應。"},{q:"面對貧賤的生活，他的態度是什麼？",options:["「晏如也」、「不戚戚於貧賤」——雖貧窮卻不憂愁","感到羞恥，盡量不讓人知道","努力追求財富，想要脫離貧窮","只要有酒喝，其他都可以放棄"],answer:0,explain:"第四章的「晏如也」與贊語的「不戚戚於貧賤」，說的是同一種安然。"},{q:"綜合五章線索，五柳先生最接近哪一種人？",options:["追求功名、積極入世的官員","淡泊名利、率真自然、安貧樂道的隱士","喜歡熱鬧、交遊廣闊的富人","嗜酒如命、不顧一切的醉漢"],answer:1,explain:"名號隨意、閑靜少言、讀書會意、飲酒率真、安於貧困、著文自娛——拼起來，就是一位淡泊自適的隱士。"}]},ch5_box:{type:"clueSlots",title:"謎題三：誰寫下了這篇傳記？",prompt:"把你找回的四段記憶，放進木匣上對應的凹槽。",slots:[{label:"宅邊有五柳樹，因以為號焉",accept:"c1"},{label:"閑靜少言，不慕榮利",accept:"c2"},{label:"性嗜酒，家貧不能常得",accept:"c3"},{label:"環堵蕭然……晏如也",accept:"c4"}],explain:"四段記憶歸位，木匣的鎖應聲而開。"},ch4_words:{type:"flip",title:"生活之謎：翻牌配對",prompt:"把屋裡找到的景象記牢：翻開兩張牌，字詞和解釋相符就配對成功。",source:"環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空——晏如也。",pairs:[{id:"a",word:"環堵",meaning:"四周的土牆"},{id:"b",word:"蕭然",meaning:"空寂冷落的樣子"},{id:"c",word:"短褐",meaning:"粗布短衣"},{id:"d",word:"穿結",meaning:"破了洞又打結補綴"},{id:"e",word:"簞",meaning:"盛飯的圓形竹器"},{id:"f",word:"晏如",meaning:"安然自在的樣子"}],explain:"屋子破、衣服破、飯籃常空——卻「晏如也」。前面寫盡貧困，最後三字翻轉出安然自得的心境。"}},dg={"1-0":"走出茅屋，到屋外找那個呼喚你的人說說話。","1-1":"找出茅屋旁全部五棵柳樹，一棵一棵走近看看。","1-2":"五棵柳樹都看過了。到柳樹下那塊被坐平的石頭上坐一坐，回想那段文字。","2-0":"回到茅屋裡，和鄰人說話，並調查書案上的書。","2-1":"屋裡共有六卷書卷（書案、地上、門邊竹籃、牆架、書箱旁……），全部找出來。","2-2":"調查東北角上鎖的書箱，用你對主人的了解解開密鎖。","2-3":"書箱開了，看看裡面的札記。","3-0":"和鄰人說話，再調查窗臺上的信、牆角的空酒壺和門邊的燈籠。","3-1":"線索齊了，調查牆角的封泥酒甕，依時序解開機關。","3-2":"封泥開了，看看甕口的東西。","4-0":"和屋裡的鄰人說話。","4-1":"畫面上方顯示要找的句子。在茅屋中找出與它相符的物品並調查。","4-2":"回答鄰人的問題：想想「晏如也」的意思。","5-0":"調查書案上的文稿，以及床頭的卷軸。","5-1":"讀懂文稿與贊語後，調查床尾的木匣。","5-2":"彩蛋不會發光，要自己到處找：院子裡、屋子裡、柴門外都可能有。走近可疑的東西，就會出現「調查」按鈕。"},ug={manuscriptTitle:"五柳先生傳",author:"陶淵明",fullText:["先生不知何許人也，亦不詳其姓字。宅邊有五柳樹，因以為號焉。","閑靜少言，不慕榮利。好讀書，不求甚解；每有會意，便欣然忘食。性嗜酒，家貧不能常得。親舊知其如此，或置酒而招之；造飲輒盡，期在必醉；既醉而退，曾不吝情去留。環堵蕭然，不蔽風日；短褐穿結，簞瓢屢空——晏如也。常著文章自娛，頗示己志。忘懷得失，以此自終。","贊曰：黔婁之妻有言：「不戚戚於貧賤，不汲汲於富貴。」其言茲若人之儔乎？酣觴賦詩，以樂其志。無懷氏之民歟？葛天氏之民歟？"],memories:[{item:"willow",text:"宅邊有五柳樹，因以為號焉。",label:"我的號"},{item:"scroll",text:"好讀書，不求甚解；每有會意，便欣然忘食。",label:"我的個性"},{item:"jar",text:"性嗜酒……既醉而退，曾不吝情去留。",label:"我的嗜好"},{item:"clothes",text:"環堵蕭然，不蔽風日；短褐穿結——",label:"我的生活"},{item:"danpiao",text:"簞瓢屢空——晏如也。",label:"我的態度"},{item:"manuscript",text:"常著文章自娛，頗示己志。",label:"我的志趣"}],monologue:["原來，我一直尋找的，不只是一個名字。","我藉著五柳先生，寫下自己嚮往的生活。"],teaching:{title:"什麼是「假託立傳」？",body:"「五柳先生」是陶淵明的自號，五柳先生就是作者的自況。陶淵明模仿史書人物傳記的形式，假託五柳先生這個人物，描寫他的個性、嗜好、生活與志趣，寄寓自己的思想與人生態度。這種寫作方式稱為「假託立傳」。",points:[{h:"傳：模仿史傳的形式",t:"一般史傳會先交代姓名、籍貫、家世，篇末以「贊曰」評論人物。本文開頭卻說「不知何許人也，亦不詳其姓字」，一反常規，把重點放在人物的品格與志趣；篇末的贊語借黔婁之妻的話「不戚戚於貧賤，不汲汲於富貴」，總結五柳先生安貧樂道、淡泊名利的精神。"},{h:"第三者立場：客觀而含蓄",t:"作者以第三者的立場下筆，替「五柳先生」立傳，顯得客觀而含蓄；若用第一人稱直接稱讚自己，恐有自誇之嫌。"},{h:"不寫姓名家世：反諷門第風氣",t:"魏晉時期重視門第。陶淵明是東晉名將陶侃的後代，卻厭惡誇耀門閥的風氣，所以故意不寫出自己的姓名家世，是對時代風氣的一種反諷。"},{h:"以柳為號：外柔內剛",t:"柳的外表柔弱、主幹堅韌，正像隱者不與當政者正面衝突、看似柔順卻堅守原則的態度。"},{h:"作者小檔案",t:"陶淵明，又名潛，字元亮，東晉潯陽柴桑（今江西九江一帶）人。曾經出仕，後來辭官歸隱田園。死後友人私諡為「靖節先生」。是田園詩的重要代表，被譽為「古今隱逸詩人之宗」，作品收在《陶淵明集》。"}],remember:"遊戲裡「我就是陶淵明」是戲劇化的身分揭曉。課堂上請記得：五柳先生是作者的自號與自況，文中的形象經過文學剪裁，是陶淵明理想人生態度的寫照。"},question:{q:"陶淵明為什麼不直接寫「陶淵明自傳」，反而要替一位「不知何許人也」的五柳先生立傳？（請選出所有合理的原因）",options:[{t:"藉由塑造五柳先生的形象，寄託自己的理想與人生態度",ok:!0},{t:"以第三者的立場下筆，顯得客觀含蓄，避免直接稱讚自己的自誇之嫌",ok:!0},{t:"故意不寫姓名家世，反諷魏晉時期重視門第、誇耀門閥的風氣",ok:!0},{t:"隱去姓名籍貫，讓讀者把焦點放在人物的品格與志趣",ok:!0},{t:"因為陶淵明真的忘記了自己的名字",ok:!1,why:"這是遊戲劇情的設定，不是文章的寫作原因。"},{t:"為了讓別人以為這是真實的歷史名人，好博取名聲",ok:!1,why:"這與文中「不慕榮利」「不汲汲於富貴」的精神互相矛盾。"}],explain:"「不知何許人也」看似什麼都沒說，其實正說明了五柳先生不在意名號、身分與門第。作者以第三者的立場、模仿史傳的形式寫自己，既含蓄又能寄寓志向——這就是假託立傳的妙處。",shortPrompt:"（選填）用自己的話完成這句：陶淵明假託五柳先生立傳，是為了……"},final:{title:"《我是誰？》——記憶已尋回",lines:["宅邊五柳，是名號；","閑靜讀書，是性情；","一醉而歸，是真率；","簞瓢屢空，是生活；","著文自娛，是志向。"]}},fg={title:"五柳先生個人小檔案",note:"以課文文句作答。每找回一部分，檔案就會自動填上。",rows:[{id:"name",k:"姓名",v:"不詳其姓字",unlock:"ch:1"},{id:"home",k:"住處",v:"宅邊有五柳樹",unlock:"ch:1"},{id:"title",k:"稱號",v:"五柳（因以為號焉）",unlock:"ch:1"},{id:"char",k:"個性",v:"閑靜少言，不慕榮利",unlock:"flag:ch2p1"},{id:"read",k:"嗜好",sub:"一・讀書",v:"好讀書，不求甚解",att:"每有會意，便欣然忘食",unlock:"ch:2"},{id:"drink",k:"嗜好",sub:"二・喝酒",v:"性嗜酒",att:"造飲輒盡，期在必醉；既醉而退，曾不吝情去留",unlock:"flag:ch3p1"},{id:"live",k:"生活",sub:"住",v:"環堵蕭然，不蔽風日",unlock:"ch:4"},{id:"wear",k:"生活",sub:"衣",v:"短褐穿結",unlock:"ch:4"},{id:"eat",k:"生活",sub:"食",v:"簞瓢屢空",unlock:"ch:4"},{id:"att",k:"生活態度",v:"晏如也",unlock:"ch:4"},{id:"aim",k:"志趣",v:"常著文章自娛，頗示己志；忘懷得失，以此自終",unlock:"flag:ch5p1"}],moments:{home:{rows:["name","home","title"],scene:"home",caption:"一間茅屋，五棵柳樹。沒有人知道他從哪裡來，只叫他「五柳先生」。"},char:{rows:["char"],scene:"quiet",caption:"大路上車馬喧嘩，他只是靜靜坐在柳下，連頭也不抬。"},read:{rows:["read"],scene:"read",caption:"讀到會心處，他笑了起來——桌上的飯早已涼透。"},drink:{rows:["drink"],scene:"drink",caption:"親友備酒相邀，他喝個盡興；醉了，便提著燈籠搖搖晃晃地回家。"},live:{rows:["live"],scene:"dwell",caption:"四面土牆空空蕩蕩，風從破洞鑽進來，陽光從屋頂漏下來。"},wear:{rows:["wear"],scene:"clothes",caption:"一件粗布短衣，補了又補。"},eat:{rows:["eat"],scene:"food",caption:"盛飯的竹簞、舀水的瓢，常常是空的。"},att:{rows:["att"],scene:"calm",caption:"日子這般清苦，他卻安然自在，望著窗外的柳枝微笑。"},aim:{rows:["aim"],scene:"aim",caption:"燈下提筆，寫給自己看，也寫下自己的志向。"}}},pg={albumTitle:"靖節冊頁",albumNote:"破關後在居所內外四處走走，留意可疑的東西：走近時會出現「調查」按鈕。每找到一個彩蛋，就在冊頁上蓋一枚印章。",finalTitle:"古今隱逸詩人之宗",finalNote:"南朝梁代的鍾嶸在《詩品》中，稱陶淵明為「古今隱逸詩人之宗」。你已集滿五枚印章！",order:["chrys","gate","well","qin","sons"],items:{chrys:{name:"籬下菊花",verb:"摘一朵",seal:"菊",title:"采菊東籬下",source:"〈飲酒〉其五",lines:[{s:"narr",t:"籬笆下的菊花開得正好。你摘下一朵，抬起頭——"},{s:"narr",t:"遠方的南山靜靜立在暮色裡，飛鳥成群，結伴歸林。"}],poem:`結廬在人境，而無車馬喧。問君何能爾？心遠地自偏。
采菊東籬下，悠然見南山。山氣日夕佳，飛鳥相與還。
此中有真意，欲辨已忘言。`,translation:"把屋子蓋在人來人往的地方，卻聽不到車馬的喧鬧。問我怎麼能做到？只要心境遠離塵俗，住處自然顯得偏僻。在東邊籬笆下採菊花，不經意間抬頭，看見了南山。傍晚山間的雲氣很美，飛鳥結伴歸來。這其中有人生的真意，想要說明，卻已忘了該怎麼說。",quiz:{title:"鍊字推敲：見與望",questions:[{q:"「采菊東籬下，悠然見南山」的「見」，為什麼比「望」好？",options:["「見」是無意間看見南山，顯得自然悠閒；「望」是刻意眺望，少了悠然的意味","「見」的筆畫比較少，寫起來比較快","「望」是錯字，古代沒有這個字","兩個字意思完全一樣，沒有差別"],answer:0,explain:"宋代蘇軾就討論過這個字：採菊時不經意抬頭，南山自然映入眼簾，人與景物是偶然相遇，所以「悠然」。若寫成「望」，就成了刻意去看，意境便差了。「心遠地自偏」也正好呼應課文的「閑靜少言，不慕榮利」。"}]},note:"「心遠地自偏」：只要心境遠離名利，住在熱鬧處也像隱居。"},gate:{name:"柴門",verb:"推開柴門",seal:"腰",title:"不為五斗米折腰",source:"史傳記載（《宋書・隱逸傳》《晉書・隱逸傳》）",lines:[{s:"narr",t:"手一碰到柴門，粗糙的木頭觸感，忽然勾起一段很久以前的記憶——"},{s:"narr",t:"那年秋天，我在彭澤當縣令。一天，郡裡派來的督郵就要到縣裡視察。"},{s:"voice",name:"小吏",t:"大人！督郵就要到了，請您穿戴整齊、束好衣帶，前去拜見。"},{s:"me",t:"……要我為了這一點官俸，恭恭敬敬地向這種人彎腰？"}],quiz:{title:"回憶：彭澤縣令",questions:[{q:"面對小吏的提醒，當年的陶淵明怎麼回答？",options:["「吾不能為五斗米折腰，拳拳事鄉里小人邪！」","「好，我這就換上官服，恭恭敬敬地去拜見。」","「請督郵大人改天再來，我今天要喝酒。」"],answer:0,explain:"史書記載，他嘆道：「我不能為了五斗米的官俸，就彎腰去恭敬侍奉鄉里小人！」當天就交出官印，辭官回鄉。「五斗米」指微薄的官俸，「折腰」是彎腰行禮。"},{q:"陶淵明擔任彭澤縣令，一共做了多久？",options:["只有八十多天","整整八年","三年任滿","十八年"],answer:0,explain:"陶淵明在〈歸去來兮辭〉的序中自己寫道：「在官八十餘日」。上任八十多天就辭官，從此歸隱田園，再也沒有出來做官。這正是課文「不慕榮利」最好的寫照。"}]},note:"「五斗米」指微薄的官俸；「折腰」是彎腰行禮。他在彭澤令任上只有八十多天。",after:[{s:"me",t:"八十多天……那一天，我交出官印，頭也不回地回家了。"},{s:"narr",t:"柴門「吱呀」一聲開了。門外是一條小路，穿過田野，通向遠方的南山。"}]},well:{name:"水井",verb:"照一照",seal:"影",title:"井中倒影",source:"陶淵明生平",lines:[{s:"narr",t:"井水清清，映出一張清瘦的臉，鬢邊已有了白髮。"},{s:"me",t:"原來，這就是我。"},{s:"me",t:"那些年走過的路，一幕一幕浮上了水面……"}],quiz:{type:"order",title:"井中倒影：我的一生",prompt:"把陶淵明一生的經歷，依先後順序排好。（拖曳卡片，或用箭頭移動）",items:[{id:"1",text:"生於東晉末年，曾祖父陶侃是東晉名將，到他這一代家道已經中落",quote:"出身"},{id:"2",text:"為了生計，幾度出外做官，擔任過江州祭酒、鎮軍參軍等職",quote:"出仕"},{id:"3",text:"擔任彭澤縣令，只做了八十多天",quote:"彭澤令"},{id:"4",text:"不願為五斗米折腰，辭官回鄉，寫下〈歸去來兮辭〉",quote:"辭官"},{id:"5",text:"躬耕田園，寫下〈歸園田居〉〈飲酒〉等田園詩",quote:"歸隱"},{id:"6",text:"去世後，友人私下給他「靖節先生」的諡號",quote:"靖節"}],explain:"陶淵明（又名潛，字元亮）出身名門卻家境貧寒，幾度出仕又辭官，最後選擇歸隱田園。他的田園詩影響後世深遠。"},note:"陶淵明，又名潛，字元亮，東晉潯陽柴桑人，私諡靖節。"},qin:{name:"無弦琴",verb:"撫琴",seal:"琴",title:"無弦琴",source:"史傳記載（《宋書》《晉書》隱逸傳）",lines:[{s:"narr",t:"書案上方掛著一張琴。琴身光滑，卻連一根弦也沒有。"},{s:"narr",t:"你輕輕撥了一下。沒有琴聲，只有窗外的風吹過柳枝。"},{s:"narr",t:"史書記載：陶淵明不懂音律，卻收藏一張無弦琴。每當喝酒喝得暢快，就撫弄一番，用來寄託心意。"},{s:"me",t:"但識琴中趣，何勞弦上聲。"}],quiz:{type:"connect",title:"琴、文、詩：都是為了什麼？",prompt:"撫琴、寫文章、作詩，陶淵明各是為了什麼？把左邊的行為連到右邊的原文。",source:`撫弄無弦琴：「每有酒適，輒撫弄以寄其意」（史傳）
〈五柳先生傳〉：「常著文章自娛，頗示己志」「酣觴賦詩，以樂其志」`,pairs:[{id:"a",word:"撫弄無弦琴（史傳）",meaning:"以寄其意"},{id:"b",word:"常著文章（課文）",meaning:"自娛，頗示己志"},{id:"c",word:"酣觴賦詩（課文）",meaning:"以樂其志"}],distractors:["以求榮利"],explain:"三件事的目的都一樣：不是表演給別人看、也不是為了名利，而是自得其樂、表達自己的心意與志向。"},note:"撫琴「以寄其意」，著文「頗示己志」，賦詩「以樂其志」——都是為了自己的心意。",quiz2:{title:"但識琴中趣",questions:[{q:"「但識琴中趣，何勞弦上聲」最能說明陶淵明的哪一種態度？",options:["重視內心的意趣，不在乎外在形式，就像寫文章「自娛」、作詩「以樂其志」","喜歡收藏昂貴的樂器，向客人炫耀","因為太窮，買不起琴弦","想學彈琴，卻一直學不會而放棄"],answer:0,explain:"意思是：只要懂得琴中的樂趣，何必要琴弦發出聲音？琴有沒有弦不重要，重要的是心中的意趣。這和課文中「常著文章自娛」「酣觴賦詩，以樂其志」一樣：做事是為了自己心裡快樂、表達志向，不為別人的眼光，也不為名利。"}]}},sons:{name:"床上的詩稿",verb:"讀一讀",seal:"子",title:"責子詩",source:"〈責子〉",lines:[{s:"narr",t:"草蓆上壓著一張詩稿，題目是〈責子〉。"},{s:"narr",t:"「白髮被兩鬢，肌膚不復實。雖有五男兒，總不好紙筆。」"},{s:"me",t:"五個兒子……竟然沒有一個喜歡讀書。"}],poem:`白髮被兩鬢，肌膚不復實。雖有五男兒，總不好紙筆。
阿舒已二八，懶惰故無匹；阿宣行志學，而不愛文術；
雍端年十三，不識六與七；通子垂九齡，但覓梨與栗。
天運苟如此，且進杯中物。`,quiz:{type:"connect",title:"責子詩：五個兒子",source:"阿舒已二八，懶惰故無匹；阿宣行志學，而不愛文術；雍端年十三，不識六與七；通子垂九齡，但覓梨與栗。",pairs:[{id:"a",word:"阿舒（已二八）",meaning:"懶惰故無匹"},{id:"b",word:"阿宣（行志學）",meaning:"而不愛文術"},{id:"c",word:"雍、端（年十三）",meaning:"不識六與七"},{id:"d",word:"通子（垂九齡）",meaning:"但覓梨與栗"}],distractors:["好讀書，不求甚解"],explain:"詩末說「天運苟如此，且進杯中物」：天意如此，那就喝酒吧。語氣是幽默的自嘲，也看得出一位父親對孩子的疼愛。"},quiz2:{title:"年齡代稱",questions:[{q:"「阿舒已二八」「阿宣行志學」，這兩個兒子分別大約幾歲？",options:["阿舒十六歲，阿宣快十五歲","阿舒二十八歲，阿宣十歲","阿舒十歲，阿宣三十歲","阿舒八歲，阿宣二十歲"],answer:0,explain:"「二八」是二乘八，十六歲。「志學」出自《論語・為政》：「吾十有五而志於學。」後人以「志學」代稱十五歲，「行志學」就是快十五歲。類似的還有「而立」（三十）、「不惑」（四十）。"}]},note:"「二八」十六歲；「志學」十五歲；「垂九齡」快九歲。",translation:"白髮已經蓋住兩鬢，皮膚也不再結實。雖然有五個兒子，卻都不喜歡紙筆讀書。阿舒已經十六歲，懶惰得沒人比得上；阿宣快十五歲了，卻不愛學問文章；雍和端都十三歲，連六和七都分不清；通子快九歲了，只知道找梨子和栗子吃。如果天命真是這樣，那就姑且喝杯酒吧。"}}},oc={meta:ng,speakers:ig,intro:sg,chapters:rg,objects:ag,dialogues:og,ch4targets:lg,ch4wrong:cg,puzzles:hg,hints:dg,ending:ug,profile:fg,eggs:pg};function mg(i,t=!1){const e=i[0].index!==null,n=new Set(Object.keys(i[0].attributes)),s=new Set(Object.keys(i[0].morphAttributes)),r={},a={},o=i[0].morphTargetsRelative,l=new xe;let c=0;for(let h=0;h<i.length;++h){const f=i[h];let u=0;if(e!==(f.index!==null))return console.error("THREE.BufferGeometryUtils: .mergeGeometries() failed with geometry at index "+h+". All geometries must have compatible attributes; make sure index attribute exists among all geometries, or in none of them."),null;for(const d in f.attributes){if(!n.has(d))return console.error("THREE.BufferGeometryUtils: .mergeGeometries() failed with geometry at index "+h+'. All geometries must have compatible attributes; make sure "'+d+'" attribute exists among all geometries, or in none of them.'),null;r[d]===void 0&&(r[d]=[]),r[d].push(f.attributes[d]),u++}if(u!==n.size)return console.error("THREE.BufferGeometryUtils: .mergeGeometries() failed with geometry at index "+h+". Make sure all geometries have the same number of attributes."),null;if(o!==f.morphTargetsRelative)return console.error("THREE.Buf
